<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>高中数学 · 蓝志东博士</title>
    <style>
        :root {
            --ink: #1a2639;
            --blue: #1a5fb0;
            --soft-bg: #e0dbd2;
            --card-bg: #f7f3ec;
            --line: #d3cabc;
            --card-shadow: 0 8px 28px rgba(50, 40, 30, 0.10);
            --radius: 16px;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            margin: 0;
            font-family: "Microsoft YaHei", system-ui, -apple-system, sans-serif;
            color: var(--ink);
            background: var(--soft-bg);
            font-size: 120%;
            padding: 28px 20px;
            min-height: 100vh;
        }
        .wrap {
            max-width: 1360px;
            margin: 0 auto;
        }
        .hero {
            padding: 28px 36px;
            border-radius: var(--radius);
            color: #fff;
            background: linear-gradient(135deg, #3d5a78, #7d6b8a);
            box-shadow: 0 12px 36px rgba(50, 40, 30, 0.20);
            text-align: center;
            margin-bottom: 32px;
        }
        .hero h1 {
            margin: 0;
            font-size: clamp(34px, 4.2vw, 52px);
            letter-spacing: 0.02em;
        }
        .hero h1 .icon {
            font-size: 1.1em;
        }
        .hero p {
            margin: 6px 0 0;
            opacity: 0.92;
            font-size: 0.95em;
        }
        .tools {
            display: flex;
            gap: 18px;
            align-items: center;
            margin: 22px 0 30px;
            flex-wrap: wrap;
        }
        .tools input {
            flex: 1;
            min-width: 220px;
            padding: 14px 22px;
            border: 2px solid #c8beb0;
            border-radius: 12px;
            font: inherit;
            font-size: 1em;
            background: #fefcf7;
            transition: border 0.25s, box-shadow 0.25s;
        }
        .tools input:focus {
            outline: none;
            border-color: var(--blue);
            box-shadow: 0 0 0 4px rgba(26, 95, 176, 0.12);
        }
        .tools input::placeholder {
            color: #a89c8b;
        }
        .tools span {
            color: #7a6e5c;
            font-size: 0.85em;
            white-space: nowrap;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 32px;
        }
        .book {
            background: var(--card-bg);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--card-shadow);
            transition: transform 0.2s ease, box-shadow 0.25s ease;
        }
        .book:hover {
            transform: translateY(-3px);
            box-shadow: 0 14px 36px rgba(50, 40, 30, 0.14);
        }
        .book>button {
            width: 100%;
            border: 0;
            background: #eee8e0;
            padding: 18px 24px;
            text-align: left;
            font: inherit;
            color: var(--ink);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .book>button .book-label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.6em;
            letter-spacing: 0.01em;
        }
        .book>button .book-label .icon {
            font-size: 1.2em;
            line-height: 1;
        }
        .book>button small {
            font-weight: 500;
            color: #8a7d6a;
            font-size: 0.65em;
        }
        .chapters {
            padding: 8px 18px 18px;
        }
        .chapter {
            border-bottom: 1px solid #e6dfd6;
        }
        .chapter:last-child {
            border: 0;
        }
        .chapter summary {
            padding: 16px 12px;
            cursor: pointer;
            font-weight: 700;
            font-size: 1.15em;
            color: var(--ink);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .chapter summary::marker {
            color: var(--blue);
        }
        .chapter summary .ch-icon {
            font-size: 0.9em;
            opacity: 0.7;
        }
        .chapter ul {
            margin: 0 0 12px;
            padding: 0 0 0 32px;
            list-style: none;
        }
        .chapter li {
            padding: 5px 0;
            color: #4d4235;
            font-size: 0.92em;
            display: flex;
            align-items: baseline;
            gap: 6px;
        }
        .chapter li::before {
            content: "—";
            color: #bdb0a0;
            font-weight: 300;
            font-size: 0.85em;
        }
        .chapter li a {
            color: var(--blue);
            text-decoration: none;
            border-bottom: 1px dashed transparent;
            transition: border-color 0.2s, color 0.15s;
            cursor: pointer;
        }
        .chapter li a:hover {
            border-bottom-color: var(--blue);
            color: #12488a;
        }
        .hidden {
            display: none;
        }
        .highlight {
            background: #e8dfd2;
            border-radius: 4px;
            padding: 0 6px;
            transition: background 0.3s;
        }

        @media (max-width: 820px) {
            .grid {
                grid-template-columns: 1fr;
                gap: 24px;
            }
            body {
                padding: 20px 14px;
            }
            .hero {
                padding: 24px 18px;
            }
            .book>button .book-label {
                font-size: 1.4em;
            }
            body {
                font-size: 110%;
            }
        }
        @media (max-width: 480px) {
            .tools {
                flex-direction: column;
                align-items: stretch;
            }
            .book>button .book-label {
                font-size: 1.2em;
            }
            .chapter summary {
                font-size: 1em;
            }
            .chapter ul {
                padding-left: 20px;
            }
        }
    </style>
</head>
<body>
<div class="wrap">
    <header class="hero">
        <h1><span class="icon">📐</span> 高中数学 · 蓝志东博士</h1>
        <p>蓝志东博士 研发 · 高一至高三 · 互动目录</p>
    </header>

    <div class="tools">
        <input id="q" placeholder="搜索章节或小节，例如：微分、极限、矩阵">
        <span id="count"></span>
    </div>

    <section id="grid" class="grid"></section>
</div>

<script>
    // ==============================================================
    // 高中数学课程数据（六册，共28章）
    // 左列：高一上册、高二上册、高三上册
    // 右列：高一下册、高二下册、高三下册
    const books = [
        // 左一：高一上册
        ['高一上册', [
            ['1. 一元二次方程式', [
                '1.1 一元二次方程式',
                '1.2 一元二次方程式的解法',
                '1.3 根的判别式',
                '1.4 根与系数的关系'
            ]],
            ['2. 多项式', [
                '2.1 多项式与多项式函数',
                '2.2 一元多项式的运算',
                '2.3 多元多项式的运算',
                '2.4 综合除法',
                '2.5 余式定理',
                '2.6 因式定理',
                '2.7 一元多项式的因式分解',
                '2.8 解一元高次方程式'
            ]],
            ['3. 有理式', [
                '3.1 有理式',
                '3.2 约分与通分',
                '3.3 有理式的四则运算',
                '3.4 有理式方程式',
                '3.5 部分分式'
            ]],
            ['4. 无理式', [
                '4.1 根式、无理式',
                '4.2 分数指数',
                '4.3 简易有理化分母',
                '4.4 无理方程式',
                '4.5 二次不尽根'
            ]],
            ['5. 角及其单位', [
                '5.1 角的定义及单位',
                '5.2 弧度与角度',
                '5.3 弧长与扇形面积'
            ]],
            ['6. 锐角三角函数', [
                '6.1 锐角三角函数的定义',
                '6.2 特别角的三角函数值',
                '6.3 锐角三角函数的余角关系',
                '6.4 直角三角形的解法',
                '6.5 直角三角形测量问题'
            ]]
        ]],
        // 右一：高一下册
        ['高一下册', [
            ['7. 任意角的三角函数', [
                '7.1 象限',
                '7.2 任意角三角函数的定义',
                '7.3 任意三角函数值的求法',
                '7.4 三角函数的图像'
            ]],
            ['8. 任意三角形的解法', [
                '8.1 正弦定律',
                '8.2 余弦定律',
                '8.3 三角测量问题',
                '8.4 三角形的面积'
            ]],
            ['9. 三角恒等式与三角方程式', [
                '9.1 三角函数的基本恒等式',
                '9.2 两角之和与差的三角函数',
                '9.3 倍角公式与半角公式',
                '9.4 三角方程式'
            ]],
            ['10. 直角坐标系', [
                '10.1 直角坐标系',
                '10.2 距离公式',
                '10.3 分比公式',
                '10.4 三角形的面积',
                '10.5 多边形的面积'
            ]],
            ['11. 直线', [
                '11.1 斜率',
                '11.2 直线方程式的几种形式',
                '11.3 直线方程式的一般式',
                '11.4 两条直线的交点',
                '11.5 点到直线的距离、二平行线的距离'
            ]]
        ]],
        // 左二：高二上册
        ['高二上册', [
            ['12. 数列与级数', [
                '12.1 数列与级数',
                '12.2 等差数列与等差级数',
                '12.3 等比数列与等比级数',
                '12.4 简易特殊级数之和'
            ]],
            ['13. 联立方程式', [
                '13.1 二元联立方程式',
                '13.2 三元一次联立方程式'
            ]],
            ['14. 矩阵与行列式', [
                '14.1 矩阵',
                '14.2 矩阵的加减法',
                '14.3 矩阵的纯量积',
                '14.4 矩阵的乘法',
                '14.5 行列式',
                '14.6 逆矩阵',
                '14.7 高斯消元法',
                '14.8 克兰姆法则'
            ]],
            ['15. 不等式与线性规划', [
                '15.1 不等式及其性质',
                '15.2 一元一次不等式',
                '15.3 一元二次不等式',
                '15.4 一元高次不等式',
                '15.5 分式不等式',
                '15.6 含绝对值的不等式',
                '15.7 二元一次不等式',
                '15.8 线性规划'
            ]],
            ['16. 圆', [
                '16.1 圆的标准方程式',
                '16.2 圆的一般方程式',
                '16.3 圆的相关问题'
            ]],
            ['17. 立体几何与经纬度', [
                '17.1 立体图形',
                '17.2 直线与平面所成的角',
                '17.3 两个平面所成的角',
                '17.4 经纬线与经纬度',
                '17.5 同一经线上两地的距离',
                '17.6 同一纬线上两地的距离'
            ]]
        ]],
        // 右二：高二下册
        ['高二下册', [
            ['18. 统计学', [
                '18.1 统计学的基本概念',
                '18.2 资料的处理',
                '18.3 集中趋势',
                '18.4 离中趋势',
                '18.5 变异系数',
                '18.6 相关及相关系数',
                '18.7 统计指数'
            ]],
            ['19. 排列与组合', [
                '19.1 加法原理及乘法原理',
                '19.2 排列与排列数公式',
                '19.3 环形排列',
                '19.4 不尽相异元素的全排列',
                '19.5 元素可重复的排列',
                '19.6 组合与组合数公式'
            ]],
            ['20. 二项式定理', [
                '20.1 指数为自然数的二项式定理',
                '20.2 二项展开式的通项公式'
            ]],
            ['21. 概率', [
                '21.1 样本空间与事件',
                '21.2 概率的定义',
                '21.3 加法原理',
                '21.4 乘法原理',
                '21.5 数学期望值',
                '21.6 常态分配'
            ]]
        ]],
        // 左三：高三上册
        ['高三上册', [
            ['22. 函数', [
                '22.1 函数的定义',
                '22.2 函数的定义域与值域',
                '22.3 函数的图像及其变换',
                '22.4 合成函数',
                '22.5 一对一函数、映成函数、一一映成函数',
                '22.6 反函数'
            ]],
            ['23. 指数与对数', [
                '23.1 指数',
                '23.2 对数',
                '23.3 对数的运算法则与换底公式',
                '23.4 指数方程式',
                '23.5 对数方程式',
                '23.6 复利与年金'
            ]],
            ['24. 极限', [
                '24.1 极限概念',
                '24.2 函数的极限',
                '24.3 函数极限的运算法则'
            ]],
            ['25. 微分', [
                '25.1 曲线上切线的斜率',
                '25.2 切线斜率与导数',
                '25.3 微分法则',
                '25.4 链导法——合成函数的微分法',
                '25.5 高阶导数',
                '25.6 隐函数的微分法',
                '25.7 两个基本极限',
                '25.8 三角函数的导数',
                '25.9 对数函数的导数',
                '25.10 指数函数的导数'
            ]]
        ]],
        // 右三：高三下册
        ['高三下册', [
            ['26. 微分的应用', [
                '26.1 切线与法线',
                '26.2 函数的增减性',
                '26.3 函数的极大值与极小值',
                '26.4 函数的最大值与最小值',
                '26.5 曲线的凸向及拐点',
                '26.6 曲线的作图法',
                '26.7 变率',
                '26.8 近似计算'
            ]],
            ['27. 不定积分', [
                '27.1 不定积分——微分的反运算',
                '27.2 不定积分的运算法则',
                '27.3 换元积分法',
                '27.4 部分分式积分法',
                '27.5 不定积分的应用'
            ]],
            ['28. 定积分', [
                '28.1 定积分的概念其与不定积分的关系',
                '28.2 定积分的性质及运算',
                '28.3 面积',
                '28.4 旋转体的体积'
            ]]
        ]]
    ];

    // 构建小节映射
    const sectionMap = new Map();
    books.forEach(([bookName, chapters]) => {
        chapters.forEach(([chapterTitle, sections]) => {
            sections.forEach(s => {
                sectionMap.set(s, { bookName, chapterTitle, section: s });
            });
        });
    });

    const grid = document.querySelector('#grid'),
        q = document.querySelector('#q'),
        count = document.querySelector('#count');

    function jumpToSection(sectionName) {
        const info = sectionMap.get(sectionName);
        if (!info) { alert('未找到：' + sectionName); return; }
        const allBooks = document.querySelectorAll('.book');
        let targetBook = null, targetSummary = null;
        allBooks.forEach(book => {
            const btn = book.querySelector('button .book-label');
            if (btn && btn.textContent.trim() === info.bookName) {
                targetBook = book;
            }
        });
        if (!targetBook) { alert('未找到对应的册'); return; }
        const container = targetBook.querySelector('.chapters');
        if (container) container.classList.remove('hidden');
        const summaries = targetBook.querySelectorAll('.chapter summary');
        summaries.forEach(sum => {
            if (sum.textContent.trim() === info.chapterTitle) {
                targetSummary = sum;
            }
        });
        if (!targetSummary) { alert('未找到对应的章'); return; }
        const details = targetSummary.closest('details');
        if (details) details.open = true;
        targetSummary.scrollIntoView({ behavior: 'smooth', block: 'center' });
        const lis = targetSummary.closest('details').querySelectorAll('li');
        lis.forEach(li => {
            const a = li.querySelector('a');
            if (a && a.textContent.trim() === sectionName) {
                li.classList.add('highlight');
                setTimeout(() => li.classList.remove('highlight'), 2000);
            }
        });
    }

    function render() {
        let key = q.value.trim().toLowerCase(), shown = 0;
        grid.innerHTML = books.map(([name, chs]) => {
            let visible = chs.filter(c => !key || (c[0] + ' ' + c[1].join(' ')).toLowerCase().includes(key));
            if (!visible.length) return '';
            shown += visible.length;
            return `<article class="book"><button onclick="this.nextElementSibling.classList.toggle('hidden')"><span class="book-label"><span class="icon">📘</span>${name}</span><small>${visible.length} 章</small></button><div class="chapters">${visible.map(([t, ss]) => `<details class="chapter"><summary><span class="ch-icon">📖</span>${t}</summary><ul>${ss.map(s => s === '15.1 不等式及其性质'
    ? `<li><a href="15.1_不等式及其性质.html">${s}</a></li>`
    : `<li><a onclick="jumpToSection('${s.replace(/'/g, "\\'")}')">${s}</a></li>`
).join('')}</ul></details>`).join('')}</div></article>`
        }).join('');
        count.textContent = `显示 ${shown} 个章节`;
    }
    q.addEventListener('input', render);
    render();
    window.jumpToSection = jumpToSection;
</script>
</body>
</html>
